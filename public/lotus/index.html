<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lotus · Dizi ve film takibi</title>
<meta name="description" content="Lotus: dizi ve filmlerini takip et, arkadaşlarınla paylaş.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Lotus">
<meta property="og:title" content="Lotus · Dizi ve film takibi">
<meta property="og:description" content="Dizi ve filmlerini takip et, arkadaşlarınla paylaş. 🪷">
<meta property="og:image" content="https://mercansoftware.pages.dev/lotus/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://mercansoftware.pages.dev/lotus/og.png">
<meta name="theme-color" content="#0b0912">
<meta name="robots" content="noindex">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0912;
    --card: rgba(255,255,255,0.055);
    --line: rgba(255,255,255,0.10);
    --text: #f4f1fa;
    --muted: rgba(244,241,250,0.68);
    --accent: #a066ff;
    --warm: #ff5c9d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh;
    padding: 28px 16px; overflow-x: hidden; position: relative; }
  /* The shared title's poster, blown up and blurred behind everything. */
  .backdrop { position: fixed; inset: -60px; background-size: cover; background-position: center;
    filter: blur(48px) saturate(1.3); opacity: 0; transform: scale(1.1);
    transition: opacity 1.2s ease, transform 1.6s ease; z-index: 0; }
  .backdrop.on { opacity: 0.45; transform: scale(1); }
  .glow { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(60% 40% at 15% 8%, rgba(160,102,255,0.30), transparent 70%),
      radial-gradient(50% 40% at 92% 92%, rgba(255,92,157,0.24), transparent 70%),
      linear-gradient(180deg, rgba(11,9,18,0.2), rgba(11,9,18,0.85)); }
  /* Petals drifting up in the background. */
  .petal { position: fixed; bottom: -40px; width: 14px; height: 22px; border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%;
    background: linear-gradient(180deg, rgba(255,140,190,0.55), rgba(160,102,255,0.35));
    animation: drift linear infinite; z-index: 0; pointer-events: none; }
  main { width: 100%; max-width: 400px; text-align: center; position: relative; z-index: 1; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 30px;
    padding: 30px 24px 24px; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 30px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
    animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
  .logo { width: 84px; margin: 0 auto 10px; display: block;
    filter: drop-shadow(0 0 22px rgba(205,100,230,0.55)); animation: breathe 2.8s ease-in-out infinite; }
  .brand { font-weight: 800; font-size: 15px; letter-spacing: 4px; text-transform: uppercase;
    color: var(--muted); margin: 0 0 18px; }
  .poster { width: 150px; aspect-ratio: 2/3; margin: 4px auto 18px; border-radius: 18px; overflow: hidden;
    box-shadow: 0 24px 50px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.12);
    animation: pop .9s cubic-bezier(.2,1.3,.3,1) .15s both; position: relative; }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .poster::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.22) 45%, transparent 60%);
    transform: translateX(-120%); animation: shine 2.8s ease 1s infinite; }
  .kind { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700;
    letter-spacing: .6px; text-transform: uppercase; padding: 5px 12px; border-radius: 99px; margin-bottom: 10px;
    color: #fff; background: linear-gradient(90deg, var(--accent), var(--warm)); }
  h1 { font-size: 27px; line-height: 1.15; margin: 0 0 8px; letter-spacing: -0.4px; font-weight: 800;
    background: linear-gradient(90deg, #c9b3ff, #ffb3cf); -webkit-background-clip: text;
    background-clip: text; color: transparent; }
  p { margin: 0 0 22px; color: var(--muted); line-height: 1.55; font-size: 15px; }
  .code { display: inline-block; font-size: 30px; font-weight: 800; letter-spacing: 8px;
    padding: 12px 20px 12px 28px; border-radius: 16px; margin: 0 0 22px;
    background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.16); }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 16px;
    border-radius: 16px; border: 0; font: inherit; font-size: 16px; font-weight: 700; text-decoration: none;
    cursor: pointer; margin-top: 10px; transition: transform .15s ease; }
  .primary { color: #fff; background: linear-gradient(90deg, var(--accent), var(--warm));
    box-shadow: 0 12px 32px rgba(200,90,220,0.45); }
  .soft { color: var(--text); background: rgba(255,255,255,0.07); border: 1px solid var(--line); }
  .btn:active { transform: scale(.97); }
  small { display: block; margin-top: 16px; color: var(--muted); font-size: 12px; }
  .hidden { display: none !important; }
  @keyframes rise { from { opacity: 0; transform: translateY(22px) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: translateY(16px) scale(.85) rotate(-3deg); } to { opacity: 1; transform: none; } }
  @keyframes breathe { 0%,100% { transform: scale(.96); } 50% { transform: scale(1.04); } }
  @keyframes shine { 0% { transform: translateX(-120%); } 40%,100% { transform: translateX(120%); } }
  @keyframes drift { from { transform: translateY(0) rotate(0); opacity: 0; } 10% { opacity: 1; }
    to { transform: translateY(-110vh) rotate(260deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, .petal { animation: none !important; } }
</style>
</head>
<body>
<div id="backdrop" class="backdrop"></div>
<div class="glow"></div>
<main>
  <div class="card">
    <img class="logo" src="logo.png" alt="Lotus">
    <div id="brand" class="brand">Lotus</div>
    <div id="poster" class="poster hidden"><img id="posterImg" alt=""></div>
    <div id="kind" class="kind hidden"></div>
    <h1 id="title">Lotus</h1>
    <p id="body">Dizi ve filmlerini takip et, arkadaşlarınla paylaş.</p>
    <div id="code" class="code hidden"></div>
    <a id="open" class="btn primary" href="#">Lotus'ta aç</a>
    <a id="store" class="btn soft" href="#">Google Play'den indir</a>
    <small id="note"></small>
  </div>
</main>
<script>
(function () {
  var pkg = 'com.mercansoftware.lotus';
  var q = new URLSearchParams(location.search);
  var tr = (navigator.language || 'en').toLowerCase().indexOf('tr') === 0;
  var t = tr ? {
    open: "Lotus'ta aç", store: "Google Play'den indir",
    s: 'Arkadaşın sana bu diziyi gönderdi. Lotus\'ta aç, takip et, birlikte konuşun.',
    m: 'Arkadaşın sana bu filmi gönderdi. Lotus\'ta aç, listene ekle.',
    sAnon: 'Arkadaşın sana bir dizi gönderdi. Lotus\'ta aç, takip et, birlikte konuşun.',
    mAnon: 'Arkadaşın sana bir film gönderdi. Lotus\'ta aç, listene ekle.',
    u: 'Bir arkadaşın Lotus profilini paylaştı. Ne izlediğine bak, takip et.',
    i: 'Lotus\'a davet edildin! Uygulamayı kur, sonra bu sayfaya geri dönüp "Lotus\'ta aç"a dokun ya da kodu gir: ikiniz de hediye kazanın.',
    inviteTitle: 'Davetiyen hazır 🎁', def: 'Dizi ve filmlerini takip et, arkadaşlarınla paylaş.',
    series: 'Dizi', movie: 'Film', profile: 'Profil',
    note: 'Uygulama açılmazsa önce Google Play\'den indir.'
  } : {
    open: 'Open in Lotus', store: 'Get it on Google Play',
    s: 'A friend sent you this series. Open it in Lotus, track it, talk about it together.',
    m: 'A friend sent you this movie. Open it in Lotus and add it to your list.',
    sAnon: 'A friend sent you a series. Open it in Lotus, track it, talk about it together.',
    mAnon: 'A friend sent you a movie. Open it in Lotus and add it to your list.',
    u: 'A friend shared their Lotus profile. See what they watch and follow them.',
    i: 'You\'re invited to Lotus! Install the app, then come back here and tap "Open in Lotus", or enter the code: you both get a gift.',
    inviteTitle: 'Your invite is ready 🎁', def: 'Track your shows and movies, share them with friends.',
    series: 'Series', movie: 'Movie', profile: 'Profile',
    note: 'If the app does not open, get it from Google Play first.'
  };
  var key = null, value = null;
  ['s', 'm', 'u', 'i'].forEach(function (k) {
    var v = q.get(k);
    if (!key && v && /^[A-Za-z0-9-]{1,64}$/.test(v)) { key = k; value = v; }
  });
  // The name and poster a share from the app carries along.
  var name = (q.get('n') || '').slice(0, 120);
  var path = q.get('p') || '';
  var poster = /^\/banners\/[A-Za-z0-9_\/.-]{1,200}\.(jpg|jpeg|png|webp)$/i.test(path)
    ? 'https://artworks.thetvdb.com' + path : null;

  var query = key ? key + '=' + encodeURIComponent(value) : '';
  var store = 'https://play.google.com/store/apps/details?id=' + pkg +
    (key === 'i' ? '&referrer=' + encodeURIComponent('invite=' + value) : '');
  var deep = 'intent://open' + (query ? '?' + query : '') +
    '#Intent;scheme=lotus;package=' + pkg + ';S.browser_fallback_url=' + encodeURIComponent(store) + ';end';
  var android = /android/i.test(navigator.userAgent);
  var $ = function (id) { return document.getElementById(id); };

  $('open').textContent = t.open;
  $('store').textContent = t.store;
  $('store').href = store;
  $('note').textContent = t.note;
  var body = key ? t[key] : t.def;
  if ((key === 's' || key === 'm') && !name) body = t[key + 'Anon'];
  $('body').textContent = body;

  if ((key === 's' || key === 'm') && name) {
    $('title').textContent = name;
    $('kind').textContent = key === 's' ? t.series : t.movie;
    $('kind').classList.remove('hidden');
    $('brand').classList.add('hidden');
    document.title = name + ' · Lotus';
  } else if (key === 'i') {
    $('title').textContent = t.inviteTitle;
    $('code').textContent = value.toUpperCase();
    $('code').classList.remove('hidden');
    document.title = t.inviteTitle + ' · Lotus';
  }
  if (poster && (key === 's' || key === 'm')) {
    var img = $('posterImg');
    img.alt = name;
    img.onload = function () {
      $('poster').classList.remove('hidden');
      var b = $('backdrop');
      b.style.backgroundImage = 'url("' + poster + '")';
      requestAnimationFrame(function () { b.classList.add('on'); });
    };
    img.src = poster;
  }

  // A few petals drifting up behind the card.
  for (var i = 0; i < 10; i++) {
    var p = document.createElement('div');
    p.className = 'petal';
    p.style.left = (Math.random() * 100) + 'vw';
    p.style.animationDuration = (9 + Math.random() * 9) + 's';
    p.style.animationDelay = (-Math.random() * 14) + 's';
    p.style.transform = 'scale(' + (0.5 + Math.random() * 0.8) + ')';
    document.body.appendChild(p);
  }

  var open = $('open');
  if (android) {
    open.href = deep;
    // Straight into the app when it is there; the page stays for a tap.
    if (key) setTimeout(function () { location.href = deep; }, 900);
  } else {
    open.href = store;
  }
})();
</script>
</body>
</html>
